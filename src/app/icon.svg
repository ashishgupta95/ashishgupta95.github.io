<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="navyGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#121f38" />
      <stop offset="100%" stop-color="#09111e" />
    </radialGradient>
    <filter id="coralGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ff6b6b" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Deep Navy Rounded Squircle Background -->
  <rect 
    x="12" 
    y="12" 
    width="488" 
    height="488" 
    rx="110" 
    ry="110" 
    fill="url(#navyGlow)" 
    stroke="#ff6b6b" 
    stroke-width="16" 
    stroke-opacity="0.9" 
  />

  <!-- Coral Status Dot with Pulse Ring -->
  <circle cx="415" cy="98" r="38" fill="none" stroke="#ff6b6b" stroke-width="4" stroke-opacity="0.35" />
  <circle cx="415" cy="98" r="28" fill="#ff6b6b" filter="url(#coralGlow)" />

  <!-- Monogram: A (Warm Cream) + G (Vibrant Coral) -->
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="220" letter-spacing="-6">
    <text x="145" y="328" fill="#fdfbf7" text-anchor="middle">A</text>
    <text x="325" y="328" fill="#ff6b6b" text-anchor="middle" filter="url(#coralGlow)">G</text>
  </g>
</svg>
