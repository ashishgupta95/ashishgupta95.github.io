<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="midnightGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0b0e17" />
      <stop offset="100%" stop-color="#050608" />
    </radialGradient>
    <filter id="limeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#22c55e" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Midnight Black Rounded Squircle Background -->
  <rect 
    x="12" 
    y="12" 
    width="488" 
    height="488" 
    rx="110" 
    ry="110" 
    fill="url(#midnightGlow)" 
    stroke="#22c55e" 
    stroke-width="16" 
    stroke-opacity="0.9" 
  />

  <!-- Lime Green Status Dot with Pulse Ring -->
  <circle cx="415" cy="98" r="38" fill="none" stroke="#22c55e" stroke-width="4" stroke-opacity="0.35" />
  <circle cx="415" cy="98" r="28" fill="#22c55e" filter="url(#limeGlow)" />

  <!-- Monogram: A (Pure White) + G (Lime Green) -->
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="220" letter-spacing="-6">
    <text x="145" y="328" fill="#FFFFFF" text-anchor="middle">A</text>
    <text x="325" y="328" fill="#22c55e" text-anchor="middle" filter="url(#limeGlow)">G</text>
  </g>
</svg>
